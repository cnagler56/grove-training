server:
  # Railway sets PORT; locally it falls back to SERVER_PORT or 8084.
  port: ${PORT:${SERVER_PORT:8084}}
  error:
    # Send our friendly ResponseStatusException messages ("That team code isn't right…") to the UI.
    include-message: always

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/grove_training?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    # Locally this falls back to MYSQL_ROOT_PASSWORD from backend/.env; on Railway set DB_PASSWORD.
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:}}
    hikari:
      # Let idle connections close so a sleeping Railway service can actually sleep.
      minimum-idle: 0
      idle-timeout: 60000

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    hibernate:
      ddl-auto: update

  # Outgoing email (new-application notices to owners). Blank MAIL_HOST = off.
  # Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<16-char app password>.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000

logging:
  level:
    root: warn
    org.springframework.web: info
    org.hibernate: error

# App
app:
  # Employees type this code to create an account. Leave blank to turn sign-up off.
  signup-code: ${TEAM_SIGNUP_CODE:}
  # Comma-separated emails that become OWNER when they sign up.
  admin-emails: ${ADMIN_EMAILS:}
  # Where links in emails point (the Next.js site).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3001}
  # The salon's time zone, for "today" (birthdays, anniversaries). Railway servers run on UTC.
  time-zone: ${SALON_TIME_ZONE:America/Chicago}
  mail:
    # "From" address on emails. Defaults to MAIL_USERNAME (Gmail requires that anyway).
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  # true in production (HTTPS): the sign-in cookie is only ever sent over HTTPS.
  cookie-secure: ${COOKIE_SECURE:false}
  # The Grove Trail. Practice mode is for trying a game in one sitting: turns don't wait
  # for Salon Ultimate checks and everyone starts with 2,000 coins. Leave it off for real games.
  trail:
    practice: ${TRAIL_PRACTICE:false}
  # Salon Ultimate sign-in for pulling each employee's weekly numbers (Saturday mornings).
  # Blank username/password = off.
  salon-ultimate:
    url: ${SALON_ULTIMATE_URL:https://fsnagel.salonultimate.com}
    username: ${SALON_ULTIMATE_USERNAME:}
    password: ${SALON_ULTIMATE_PASSWORD:}
    # The store whose store-level reports to read (FS Maple Grove Parkway).
    store-id: ${SALON_ULTIMATE_STORE_ID:3}
  # Phone notifications (web push). Blank = off. Keep the private key secret.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    # Who push services contact about these messages. Apple requires https: or mailto:.
    subject: ${VAPID_SUBJECT:${APP_FRONTEND_URL:https://grove-training.vercel.app}}
  bunny:
    # Bunny Stream → your video library → API. All blank = uploads disabled.
    library-id: ${BUNNY_LIBRARY_ID:}
    api-key: ${BUNNY_API_KEY:}
    # Library → Security → "Embed view token authentication" key. Blank = unsigned embeds.
    token-key: ${BUNNY_TOKEN_KEY:}
    # Library → API → "CDN hostname" (e.g. vz-abc123.b-cdn.net), used for thumbnails.
    cdn-hostname: ${BUNNY_CDN_HOSTNAME:}
