services:
  mysql:
    image: mysql:8.4
    container_name: grove-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grove_training
      # Set MYSQL_ROOT_PASSWORD in backend/.env (copy from .env.example). Never commit it.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in backend/.env}
    # Host 3308 keeps this clear of AgriServer (3306) and retirement-planner (3307).
    ports:
      - "3308:3306"
    volumes:
      - grove_mysql_data:/var/lib/mysql
    healthcheck:
      # $$ escapes to $ so the container expands its own env var — the password
      # value never appears in this file.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  grove_mysql_data:
